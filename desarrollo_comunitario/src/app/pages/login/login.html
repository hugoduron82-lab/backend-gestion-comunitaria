<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-800 to-blue-600">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-8">

    <div class="mb-6 text-center">
      <img src="/logo-danli.png" alt="Municipalidad de Danlí"
     class="w-14 h-14 object-contain mx-auto mb-3" />
      <h2 class="text-xl font-bold text-slate-800">Gestión Comunitaria</h2>
      <p class="text-sm text-slate-500">Municipalidad de Danlí</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-4">

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">
          Correo institucional
        </label>
        <input
          type="email"
          [(ngModel)]="correo"
          name="correo"
          required
          placeholder="correo@municipalidadhn.info"
          class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm
                 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">
          Contraseña
        </label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          required
          placeholder="••••••••"
          class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm
                 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <!-- login.html -->
<!-- Solo cambian las líneas que usan error y cargando — se llaman como función -->

@if (error()) {
  <div class="bg-red-50 border border-red-200 text-red-600 text-sm rounded-lg px-3 py-2">
    ⚠️ {{ error() }}
  </div>
}

<button
  type="submit"
  [disabled]="cargando()"
  class="w-full bg-slate-800 hover:bg-blue-700 text-white font-semibold
         rounded-lg py-2.5 text-sm transition disabled:opacity-60"
>
  {{ cargando() ? 'Verificando...' : 'Ingresar al sistema' }}
</button>

    </form>

    <p class="text-center text-xs text-slate-400 mt-6">
      Municipalidad de Danlí © 2026
    </p>
  </div>
</div>
